spring:
  cloud:
    nacos:
      discovery:
        enabled: false
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      config:
        enabled: true
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      username: nacos
      password: nacos
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/diagagent?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      character-encoding: UTF-8
      connection-init-sql: SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://root:1234@localhost:27017/diagagent?authSource=admin}
      database: diagagent
      auto-index-creation: true
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${SPRING_REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${SPRING_REDIS_PORT:6379}}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        connection:
          characterEncoding: utf-8
          useUnicode: true
          CharSet: utf-8
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: never

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    map-underscore-to-camel-case: true
